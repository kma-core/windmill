app = "kma-windmill"
primary_region = "fra"

[build]
  image = "ghcr.io/windmill-labs/windmill:main"

[env]
  MODE = "server"
  RUST_LOG = "info"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"

[[mounts]]
  source = "windmill_server_logs"
  destination = "/tmp/windmill"
