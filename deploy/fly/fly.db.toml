app = "kma-windmill-db"
primary_region = "fra"

[build]
  image = "postgres:17"

[env]
  POSTGRES_DB = "windmill"
  POSTGRES_USER = "windmill"
  PGDATA = "/var/lib/postgresql/data/pgdata"

[[services]]
  internal_port = 5432
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[services.ports]]
    port = 5432

[[mounts]]
  source = "pgdata"
  destination = "/var/lib/postgresql/data"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
